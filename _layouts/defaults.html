<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicons/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicons/favicon-16x16.png' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/favicons/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicons/apple-touch-icon.png' | relative_url }}">
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    {% seo %}
</head>
<body>
    <nav {% if page.layout == 'post' %}class="wide"{% endif %}>
        <div class="nav-content">
            <div class="nav-logo" style="cursor: pointer;" onclick="window.location.href='{{ '/' | relative_url }}'">{{ site.title }}</div>
            <div class="nav-links mono">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/resume.html' | relative_url }}">Resume</a>
                <a href="{{ '/archive.html' | relative_url }}">Archive</a>
            </div>
        </div>
    </nav>

    {{ content }}

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="{{ '/js/scroll.js' | relative_url }}"></script>
</body>
</html>
