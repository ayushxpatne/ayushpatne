---
layout: default
---

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">

<div class="blog-container">
    <article class="blog-content">
        <div id="blog-header">
            <h1>{{ page.title }}</h1>
            <p class="card-meta mono">
                {{ page.date | date: "%b %-d, %Y" }} · {{ page.read_time }}
            </p>
            <div class="post-tags" style="margin-bottom: 40px;">
                {% for tag in page.tags %}
                <span class="tag mono">{{ tag }}</span>
                {% endfor %}
            </div>
        </div>
        <div id="blog-content" class="blog-post">
            {{ content }}
        </div>
    </article>

    <aside class="toc-sidebar">
        <div class="toc-title mono">Contents</div>
        <ul id="toc-list" class="toc-list"></ul>
    </aside>
</div>

<footer style="max-width: 1200px; margin: 0 auto;">
    <p class="mono">Built with HTML & CSS · Hosted on GitHub Pages</p>
    <p style="margin-top: 8px;">© 2025 {{ site.title }}</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"></script>

<script>
    // Generate TOC
    document.addEventListener('DOMContentLoaded', function() {
        const content = document.getElementById('blog-content');
        const tocList = document.getElementById('toc-list');
        const headings = content.querySelectorAll('h2, h3');
        
        headings.forEach((heading, index) => {
            const id = `heading-${index}`;
            heading.id = id;
            
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `#${id}`;
            a.textContent = heading.textContent;
            
            if (heading.tagName === 'H3') {
                a.classList.add('toc-h3');
            }
            
            li.appendChild(a);
            tocList.appendChild(li);
        });
        
        // Active TOC on scroll
        window.addEventListener('scroll', () => {
            let current = '';
            headings.forEach(heading => {
                const top = heading.offsetTop;
                if (window.scrollY >= top - 100) {
                    current = heading.id;
                }
            });
            
            document.querySelectorAll('#toc-list a').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('active');
                }
            });
        });
        
        // Render math
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(content, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                ],
                throwOnError: false
            });
        }
        
        // Syntax highlighting
        if (typeof Prism !== 'undefined') {
            Prism.highlightAll();
        }
    });
</script>
